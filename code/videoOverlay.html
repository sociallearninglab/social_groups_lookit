<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gazorp Experiment Video Player</title>
    <style>
        html, body, iframe {
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
            overflow: hidden !important;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border: none;
        }
        
        body {
            margin: 0;
            padding: 0;
            background-color: #fff;
            overflow: hidden;
            border: none;
        }
        
        .player-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            border: none;
            background-color: #fff;
        }
        
        #videoElement {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        
        .overlay-image {
            position: absolute;
            top: 35pt;
            left: 2pt;
            width: 100%;
            height: 44.5%;
            object-fit: contain;
            display: none;
        }
        
        #statusMessage {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            z-index: 100;
            font-family: monospace;
            font-size: 12px;
            display: none;
        }
        
        #nextButton {
            display: none;
        }
        
        #initialPlayButton {
            position: absolute;
            top: 70%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 40px;
            font-size: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            cursor: pointer;
            z-index: 200;
        }
        
        #initialPlayButton:hover {
            background-color: rgba(0, 0, 0, 0.9);
        }
    </style>
</head>
<body>
    <div class="player-container" id="playerContainer">
        <video id="videoElement" playsinline preload="auto">
            <source src="" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        
        <!-- Hidden audio element for background music -->
        <audio id="backgroundAudio" preload="auto">
            <source src="" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
        
        <div id="statusMessage"></div>
        <button id="initialPlayButton">Start Story</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Grab all the elements
            const playerContainer = document.getElementById('playerContainer');
            const video = document.getElementById('videoElement');
            const audio = document.getElementById('backgroundAudio');
            const initialPlayButton = document.getElementById('initialPlayButton');
            const statusMessage = document.getElementById('statusMessage');
            
            // Base paths - using relative paths for web compatibility
            const BASE_PATH = "";  // Empty for relative paths
            const VIDEO_PATH = `${BASE_PATH}/mp4`;
            const IMG_PATH = `${BASE_PATH}/img/processed/retained_images`;
            
            // Get URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const debugMode = urlParams.get('debug') === 'true';
            const fixedVersion = urlParams.get('version');
            const fixedCB = urlParams.get('cb');
            const autoAdvance = urlParams.get('autoAdvance') === 'true';
            
            // Define available experiment modes and versions
            const experimentModes = ['group', 'pref']; // First-level selection: group or preference task
            const experimentVersions = ['CD', 'Cx', 'xD']; // Second-level selection: which version
            
            // Define available counterbalances for each mode
            const groupCounterbalances = ['01', '02', '05', '06', '09', '10', '13', '14']; 
            const prefCounterbalances = ['01', '03', '05', '07', '09', '11', '13', '15'];
            
            // Define overlay image timings (in seconds)
            const overlayTimings = [
                { slide: '6', startTime: 28, endTime: 54 },
                { slide: '9', startTime: 54, endTime: 77 },
                { slide: '11', startTime: 77, endTime: 102 },
                { slide: '13', startTime: 102, endTime: 130 },
                { slide: '15', startTime: 130, endTime: 166 },
                { slide: '18', startTime: 166, endTime: 189 },
                { slide: '20', startTime: 189, endTime: 215 },
                { slide: '22', startTime: 215, endTime: 242.5 },
                { slide: '24', startTime: 242.5, endTime: 301 }
            ];
            
            // Function to choose a random element from an array
            function getRandomElement(array) {
                return array[Math.floor(Math.random() * array.length)];
            }
            
            // Step 1: Randomly assign experiment mode (group or pref)
            let experimentMode = fixedVersion ? 
                (fixedVersion.includes('group') ? 'group' : 'pref') : 
                getRandomElement(experimentModes);
            
            // Step 2: Randomly select one of the 8 counterbalances for this mode
            let selectedCB = fixedCB || (experimentMode === 'group' ? 
                getRandomElement(groupCounterbalances) : 
                getRandomElement(prefCounterbalances));
            
            // Step 3: Randomly select which version (CD, Cx, xD)
            let experimentVersion = fixedVersion ? 
                (fixedVersion.includes('CD') ? 'CD' : 
                 fixedVersion.includes('Cx') ? 'Cx' : 'xD') : 
                getRandomElement(experimentVersions);
            
            // Construct the full condition string (e.g., "group_CD")
            let selectedCondition = `${experimentMode}_${experimentVersion}`;
            
            // Build the video filename based on old CB naming convention
            const videoFilename = `${experimentMode === 'group' ? 'CD_group_CB' : 'CD_pref_CB'}${selectedCB}.mp4`;
            
            // Set video source
            video.querySelector('source').src = `${VIDEO_PATH}/${videoFilename}`;
            
            // Log the experiment setup for easy reading
            const experimentSetup = {
                mode: experimentMode,
                version: experimentVersion,
                condition: selectedCondition,
                counterbalance: selectedCB,
                videoFile: videoFilename,
                overlayImagePath: `${IMG_PATH}/${selectedCondition}/${selectedCondition}_CB${selectedCB}_slide_*.png`
            };
            
            console.log("EXPERIMENT SETUP:", experimentSetup);
            
            // In debug mode, show the setup on screen
            if (debugMode) {
                statusMessage.style.display = 'block';
                statusMessage.textContent = JSON.stringify(experimentSetup, null, 2);
            }
            
            // Create overlay config based on selected condition and CB
            let overlayConfig = [];
            
            // Create overlay config for each image timing
            overlayTimings.forEach(timing => {
                const slideNum = timing.slide;
                const imgPath = `${IMG_PATH}/${selectedCondition}/${selectedCondition}_CB${selectedCB}_slide_${slideNum}.png`;
                
                overlayConfig.push({
                    imageSrc: imgPath,
                    startTime: timing.startTime,
                    endTime: timing.endTime
                });
            });
            
            // Load the video
            video.load();
            
            // Set current time to 0 to show first frame
            video.addEventListener('loadedmetadata', function() {
                video.currentTime = 0;
            });
            
            // Create all the overlay images
            overlayConfig.forEach((config, index) => {
                const overlay = document.createElement('img');
                overlay.src = config.imageSrc;
                overlay.className = 'overlay-image';
                overlay.id = `overlay-${index}`;
                overlay.style.display = 'none';
                overlay.onerror = function() {
                    console.warn(`Image not found: ${config.imageSrc}`);
                };
                playerContainer.appendChild(overlay);
            });
            
            // Show/hide overlays based on video time
            function updateOverlays() {
                const currentTime = video.currentTime;
                
                // Check each overlay to see if it should be visible
                overlayConfig.forEach((config, index) => {
                    const overlay = document.getElementById(`overlay-${index}`);
                    if (currentTime >= config.startTime && currentTime < config.endTime) {
                        overlay.style.display = 'block';
                    } else {
                        overlay.style.display = 'none';
                    }
                });
                
                // Keep updating while video plays
                if (!video.paused) {
                    requestAnimationFrame(updateOverlays);
                }
            }
            
            // Handle video error
            video.addEventListener('error', function() {
                console.error('Video error:', video.error);
                statusMessage.style.display = 'block';
                statusMessage.textContent = `Error loading video: ${videoFilename}. Check console for details.`;
            });
            
            // Start playing when clicked
            initialPlayButton.addEventListener('click', function() {
                // Try to play the video
                video.play()
                    .then(() => {
                        updateOverlays();
                        initialPlayButton.style.display = 'none';
                        
                        // Handle audio later as mentioned
                    })
                    .catch(error => {
                        console.error('Video play failed:', error);
                        statusMessage.style.display = 'block';
                        statusMessage.textContent = 'Failed to play video. Check console for details.';
                    });
            });
            
            // When video ends
            video.addEventListener('ended', function() {
                if (autoAdvance) {
                    // Tell lookit to move to next frame
                    window.parent.postMessage({
                        type: 'nextFrame'
                    }, '*');
                }
            });
            
            // Message handler for lookit
            window.addEventListener('message', function(event) {
                if (event.data && event.data.type) {
                    switch (event.data.type) {
                        case 'play':
                            video.play()
                                .then(() => {
                                    updateOverlays();
                                })
                                .catch(e => console.error('Video play failed:', e));
                            break;
                        case 'pause':
                            video.pause();
                            break;
                        case 'setCondition':
                            if (event.data.version && event.data.cb) {
                                window.location.href = window.location.pathname + 
                                    '?version=' + event.data.version +
                                    '&cb=' + event.data.cb +
                                    '&autoAdvance=' + autoAdvance +
                                    (debugMode ? '&debug=true' : '');
                            }
                            break;
                    }
                }
            });
        });
    </script>
</body>
</html>
