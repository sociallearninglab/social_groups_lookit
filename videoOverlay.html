<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Overlay Player</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
        }
        
        .player-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        
        #videoElement {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        
        .overlay-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 55%;
            object-fit: contain;
            display: none;
        }
        
        #statusMessage {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            font-family: Arial, sans-serif;
            z-index: 10;
            pointer-events: none;
            display: none;
        }
        
        #nextButton {
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #00ab6b;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            display: none;
            z-index: 100;
        }
        
        #initialPlayButton {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 40px;
            font-size: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            cursor: pointer;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #initialPlayButton:hover {
            background-color: rgba(0, 0, 0, 0.9);
        }
    </style>
</head>
<body>
    <div class="player-container" id="playerContainer">
        <video id="videoElement" playsinline>
            <source src="" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        
        <div id="statusMessage"></div>
        <button id="nextButton">Next</button>
        <button id="initialPlayButton">Start Story</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // DOM Elements
            const playerContainer = document.getElementById('playerContainer');
            const video = document.getElementById('videoElement');
            const nextButton = document.getElementById('nextButton');
            const statusMessage = document.getElementById('statusMessage');
            
            // Get parameters from URL
            const urlParams = new URLSearchParams(window.location.search);
            const videoId = urlParams.get('videoId') || 'in4_out2_CB01';
            const autoAdvance = urlParams.get('autoAdvance') === 'true';
            const baseUrl = urlParams.get('baseUrl') || 'https://sociallearninglab.github.io/social_groups_lookit/test/';
            const showDebug = urlParams.get('debug') === 'true';
            
            // Show debug info if requested
            if (showDebug) {
                statusMessage.style.display = 'block';
            }
            
            // Video source
            const videoSrc = baseUrl + videoId + '.mp4';
            video.querySelector('source').src = videoSrc;
            video.load();
            
            // Define overlay configuration - can be overridden by URL params
            let overlayConfig = [];
            
            // Check if we have a predefined overlay configuration
            if (videoId === 'in4_out2_CB01') {
                // This is our test video, use the timestamps from the prompt
                overlayConfig = [
                    { imageSrc: baseUrl + 'slide_16.png', startTime: 54, endTime: 64 },
                    { imageSrc: baseUrl + 'slide_19.png', startTime: 64, endTime: 74 },
                    { imageSrc: baseUrl + 'slide_21.png', startTime: 74, endTime: 84 },
                    { imageSrc: baseUrl + 'slide_23.png', startTime: 84, endTime: 95 },
                    { imageSrc: baseUrl + 'slide_25.png', startTime: 95, endTime: 110 },
                    { imageSrc: baseUrl + 'slide_28.png', startTime: 110.5, endTime: 120 },
                    { imageSrc: baseUrl + 'slide_30.png', startTime: 120.5, endTime: 999 }
                ];
            } else {
                // Check if overlay config is passed via URL
                const configParam = urlParams.get('overlayConfig');
                if (configParam) {
                    try {
                        overlayConfig = JSON.parse(decodeURIComponent(configParam));
                    } catch (e) {
                        console.error('Error parsing overlay config from URL:', e);
                        if (showDebug) {
                            statusMessage.textContent = 'Error loading configuration. Using default.';
                        }
                    }
                }
            }
            
            // Create overlay images
            overlayConfig.forEach((config, index) => {
                const overlay = document.createElement('img');
                overlay.src = config.imageSrc;
                overlay.className = 'overlay-image';
                overlay.id = `overlay-${index}`;
                overlay.style.display = 'none';
                playerContainer.appendChild(overlay);
            });
            
            // Update overlay visibility based on current time
            function updateOverlays() {
                const currentTime = video.currentTime;
                
                // For debugging
                if (showDebug) {
                    const minutes = Math.floor(currentTime / 60);
                    const seconds = Math.floor(currentTime % 60);
                    statusMessage.textContent = `Time: ${minutes}:${seconds.toString().padStart(2, '0')}`;
                }
                
                overlayConfig.forEach((config, index) => {
                    const overlay = document.getElementById(`overlay-${index}`);
                    if (currentTime >= config.startTime && currentTime < config.endTime) {
                        overlay.style.display = 'block';
                    } else {
                        overlay.style.display = 'none';
                    }
                });
                
                // Continue updating if video is playing
                if (!video.paused) {
                    requestAnimationFrame(updateOverlays);
                }
            }
            
            // Handle next button click
            nextButton.addEventListener('click', function() {
                // Notify Lookit that we want to proceed
                window.parent.postMessage({
                    type: 'nextFrame'
                }, '*');
            });
            
            // Get initial play button
            const initialPlayButton = document.getElementById('initialPlayButton');
            
            // Handle initial play button click
            initialPlayButton.addEventListener('click', function() {
                video.play()
                    .then(() => {
                        updateOverlays();
                        initialPlayButton.style.display = 'none';
                        tryEnterFullscreen();
                        console.log('Video started playing after button click');
                    })
                    .catch(error => {
                        console.error('Play failed after button click:', error);
                        if (showDebug) {
                            statusMessage.textContent = 'Play failed. Please try again.';
                        }
                    });
            });
            
            // Don't try to auto-play - modern browsers block this without user interaction
            
            // Video ended event
            video.addEventListener('ended', function() {
                // Show next button when video ends
                nextButton.style.display = 'inline-block';
                
                // Auto advance to next frame if specified
                if (autoAdvance) {
                    nextButton.click();
                }
                
                // Notify parent for tracking purposes
                try {
                    window.parent.postMessage({
                        type: 'videoEnded',
                        videoId: videoId
                    }, '*');
                } catch (e) {
                    console.error('Error posting message to parent:', e);
                }
            });
            
            // Request fullscreen on first interaction (many browsers require user interaction)
            function tryEnterFullscreen() {
                if (!document.fullscreenElement) {
                    playerContainer.requestFullscreen()
                        .catch(e => console.error('Fullscreen failed:', e));
                }
            }
            
            // Try to go fullscreen on user interaction
            playerContainer.addEventListener('click', tryEnterFullscreen);
            
            // Listen for messages from parent frame (Lookit)
            window.addEventListener('message', function(event) {
                if (event.data && event.data.type) {
                    switch (event.data.type) {
                        case 'play':
                            video.play()
                                .then(() => updateOverlays())
                                .catch(e => console.error('Play from message failed:', e));
                            break;
                        case 'pause':
                            video.pause();
                            break;
                        case 'setVideo':
                            if (event.data.videoId) {
                                window.location.href = window.location.pathname + '?videoId=' + 
                                    event.data.videoId +
                                    '&autoAdvance=' + autoAdvance +
                                    '&baseUrl=' + encodeURIComponent(baseUrl);
                            }
                            break;
                        case 'requestFullscreen':
                            tryEnterFullscreen();
                            break;
                    }
                }
            });
            
            // For debugging - log when we're ready
            console.log('Video player initialized with:', { videoId, videoSrc, overlayConfig });
        });
    </script>
</body>
</html>
