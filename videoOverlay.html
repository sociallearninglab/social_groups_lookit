<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gazorp Test Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        button {
            padding: 10px 15px;
            margin: 10px 0;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #videoPlayer {
            max-width: 100%;
            margin-top: 20px;
        }
        #debugOutput {
            margin-top: 20px;
            padding: 10px;
            background-color: #f5f5f5;
            border: 1px solid #ddd;
            min-height: 100px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Gazorp Test Page</h1>
        
        <div>
            <button id="testButton">Test Script</button>
            <button id="loadVideoButton">Test Video Load</button>
        </div>
        
        <video id="videoPlayer" controls>
            <source src="" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        
        <div>
            <h3>Debug Output:</h3>
            <div id="debugOutput"></div>
        </div>
    </div>
    
    <script>
        // Basic variables
        const debugOutput = document.getElementById('debugOutput');
        const videoPlayer = document.getElementById('videoPlayer');
        const testButton = document.getElementById('testButton');
        const loadVideoButton = document.getElementById('loadVideoButton');
        
        // Check if elements were found
        function logMessage(message) {
            const timestamp = new Date().toISOString().substr(11, 8);
            const logEntry = document.createElement('div');
            logEntry.textContent = `${timestamp} - ${message}`;
            debugOutput.appendChild(logEntry);
            console.log(`[Test] ${message}`);
        }
        
        // Test if JavaScript is running properly
        document.addEventListener('DOMContentLoaded', function() {
            logMessage('Page loaded, JavaScript is running');
            
            // Check if elements were found
            if (!debugOutput) logMessage('ERROR: Debug output element not found');
            if (!videoPlayer) logMessage('ERROR: Video player element not found');
            if (!testButton) logMessage('ERROR: Test button element not found');
            if (!loadVideoButton) logMessage('ERROR: Load video button element not found');
        });
        
        // Add button event listeners
        if (testButton) {
            testButton.addEventListener('click', function() {
                logMessage('Test button clicked');
                // Test the URL parsing
                const url = new URL(window.location.href);
                logMessage(`Current URL: ${url.href}`);
                
                // Test parameter extraction
                const task = url.searchParams.get('task') || 'default_task';
                const version = url.searchParams.get('version') || 'default_version';
                const cb = url.searchParams.get('cb') || 'default_cb';
                
                logMessage(`Task: ${task}`);
                logMessage(`Version: ${version}`);
                logMessage(`CB: ${cb}`);
                
                // Test filepath generation
                if (version === 'CD') {
                    logMessage(`CD filename would be: ${version}_${task}_CB${cb}.mp4`);
                } else {
                    logMessage(`Other filename would be: ${task}_${version}_CB${cb}.mov`);
                }
            });
        }
        
        // Test video loading
        if (loadVideoButton) {
            loadVideoButton.addEventListener('click', function() {
                logMessage('Attempting to load a test video');
                
                // Get parameters from URL
                const url = new URL(window.location.href);
                const task = url.searchParams.get('task') || 'pref';
                const version = url.searchParams.get('version') || 'Cx';
                const cb = url.searchParams.get('cb') || '09';
                
                // Determine the correct filename format based on the version
                let videoFileName, videoType;
                const videoFolderName = `${version}_${task}`;
                
                if (version === 'CD') {
                    // For CD files: CD_[taskType]_CB[cb].mp4
                    videoFileName = `${version}_${task}_CB${cb}.mp4`;
                    videoType = "video/mp4";
                } else {
                    // For other files: [taskType]_[versionType]_CB[cb].mov
                    videoFileName = `${task}_${version}_CB${cb}.mov`;
                    videoType = "video/quicktime";
                }
                
                // Form the video path
                const videoUrl = `/mp4/${videoFolderName}/${videoFileName}`;
                
                // Set the video source
                videoPlayer.src = videoUrl;
                const sourceElement = videoPlayer.querySelector('source');
                if (sourceElement) {
                    sourceElement.src = videoUrl;
                    sourceElement.type = videoType;
                } else {
                    logMessage('Source element not found, creating one');
                    const source = document.createElement('source');
                    source.src = videoUrl;
                    source.type = videoType;
                    videoPlayer.appendChild(source);
                }
                
                logMessage(`Setting video source to: ${videoUrl}`);
                
                // Add event listeners for video element
                videoPlayer.addEventListener('loadeddata', function() {
                    logMessage('Video loaded successfully!');
                });
                
                videoPlayer.addEventListener('error', function(e) {
                    logMessage(`Video error: ${videoPlayer.error ? videoPlayer.error.message : 'Unknown error'}`);
                    logMessage(`Error code: ${videoPlayer.error ? videoPlayer.error.code : 'N/A'}`);
                    logMessage(`Current src: ${videoPlayer.currentSrc}`);
                });
                
                // Load and play the video
                videoPlayer.load();
            });
        }
    </script>
</body>
</html>
