<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Overlay Player</title>
    <style>
        html, body, iframe {
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
            overflow: hidden !important;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border: none;
        }
        
        body {
            margin: 0;
            padding: 0;
            background-color: #fff;
            overflow: hidden;
            border: none;
        }
        
        .player-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            border: none;
            background-color: #fff;
        }
        
        #videoElement {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        
        .overlay-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 44.5%;
            object-fit: contain;
            display: none;
        }
        
        #statusMessage {
            display: none;
        }
        
        #nextButton {
            display: none;
        }
        
        #initialPlayButton {
            position: absolute;
            top: 70%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 40px;
            font-size: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            cursor: pointer;
            z-index: 200;
        }
        
        #initialPlayButton:hover {
            background-color: rgba(0, 0, 0, 0.9);
        }
    </style>
</head>
<body>
    <div class="player-container" id="playerContainer">
        <video id="videoElement" playsinline preload="auto">
            <source src="" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        
        <!-- Hidden audio element for background music -->
        <audio id="backgroundAudio" preload="auto">
            <source src="" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
        
        <button id="initialPlayButton">Start Story</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // grab all the elements
            const playerContainer = document.getElementById('playerContainer');
            const video = document.getElementById('videoElement');
            const audio = document.getElementById('backgroundAudio');
            const initialPlayButton = document.getElementById('initialPlayButton');
            
            // get stuff from the URL
            const urlParams = new URLSearchParams(window.location.search);
            const videoId = urlParams.get('videoId') || 'in4_out2_CB01_slow';
            const audioId = urlParams.get('audioId') || 'song';
            const autoAdvance = urlParams.get('autoAdvance') === 'true';
            const baseUrl = urlParams.get('baseUrl') || 'https://sociallearninglab.github.io/social_groups_lookit/test/';
            
            // set up the video source
            const videoSrc = baseUrl + videoId + '.mp4';
            video.querySelector('source').src = videoSrc;
            
            // set up the audio source
            const audioSrc = baseUrl + audioId + '.mp3';
            audio.querySelector('source').src = audioSrc;
            
            // load the media
            video.load();
            audio.load();
            
            // set current time to 0 to show first frame
            video.addEventListener('loadedmetadata', function() {
                video.currentTime = 0;
            });
            
            // list of overlays and when to show them
            let overlayConfig = [];
            
            // set up our test video timings
            if (videoId === 'in4_out2_CB01_slow') {
                overlayConfig = [
                    { imageSrc: baseUrl + 'slide_16.png', startTime: 118.5, endTime: 144 },
                    { imageSrc: baseUrl + 'slide_19.png', startTime: 144, endTime: 167 },
                    { imageSrc: baseUrl + 'slide_21.png', startTime: 167, endTime: 192 },
                    { imageSrc: baseUrl + 'slide_23.png', startTime: 192, endTime: 220 },
                    { imageSrc: baseUrl + 'slide_25.png', startTime: 220, endTime: 256 },
                    { imageSrc: baseUrl + 'slide_28.png', startTime: 256, endTime: 279 },
                    { imageSrc: baseUrl + 'slide_30.png', startTime: 279, endTime: 320 }
                ];
            } else {
                // try to get overlay config from URL
                const configParam = urlParams.get('overlayConfig');
                if (configParam) {
                    try {
                        overlayConfig = JSON.parse(decodeURIComponent(configParam));
                    } catch (e) {
                        console.error('Error parsing overlay config:', e);
                    }
                }
            }
            
            // create all the overlay images
            overlayConfig.forEach((config, index) => {
                const overlay = document.createElement('img');
                overlay.src = config.imageSrc;
                overlay.className = 'overlay-image';
                overlay.id = `overlay-${index}`;
                overlay.style.display = 'none';
                playerContainer.appendChild(overlay);
            });
            
            // show/hide overlays based on video time
            function updateOverlays() {
                const currentTime = video.currentTime;
                
                // check each overlay to see if it should be visible
                overlayConfig.forEach((config, index) => {
                    const overlay = document.getElementById(`overlay-${index}`);
                    if (currentTime >= config.startTime && currentTime < config.endTime) {
                        overlay.style.display = 'block';
                    } else {
                        overlay.style.display = 'none';
                    }
                });
                
                // keep updating while video plays
                if (!video.paused) {
                    requestAnimationFrame(updateOverlays);
                }
            }
            
            // start playing when clicked
            initialPlayButton.addEventListener('click', function() {
                // First try to play the video
                video.play()
                    .then(() => {
                        updateOverlays();
                        initialPlayButton.style.display = 'none';
                        
                        // After video starts, start the audio
                        audio.play()
                            .then(() => {
                                console.log('Audio playing successfully');
                            })
                            .catch(error => {
                                console.error('Audio play failed:', error);
                            });
                    })
                    .catch(error => {
                        console.error('Video play failed:', error);
                    });
            });
            
            // When video ends, stop the audio too
            video.addEventListener('ended', function() {
                audio.pause();
                audio.currentTime = 0;
                
                if (autoAdvance) {
                    // tell lookit to move to next frame
                    window.parent.postMessage({
                        type: 'nextFrame'
                    }, '*');
                }
            });
            
            // Sync audio with video if either gets paused
            video.addEventListener('pause', function() {
                audio.pause();
            });
            
            video.addEventListener('play', function() {
                audio.play().catch(e => console.error('Audio resume failed:', e));
            });
            
            // Message handler for lookit
            window.addEventListener('message', function(event) {
                if (event.data && event.data.type) {
                    switch (event.data.type) {
                        case 'play':
                            video.play()
                                .then(() => {
                                    updateOverlays();
                                    audio.play().catch(e => console.error('Audio play failed:', e));
                                })
                                .catch(e => console.error('Video play failed:', e));
                            break;
                        case 'pause':
                            video.pause();
                            audio.pause();
                            break;
                        case 'setVideo':
                            if (event.data.videoId) {
                                const newAudioId = event.data.audioId || audioId;
                                window.location.href = window.location.pathname + '?videoId=' + 
                                    event.data.videoId +
                                    '&audioId=' + newAudioId +
                                    '&autoAdvance=' + autoAdvance +
                                    '&baseUrl=' + encodeURIComponent(baseUrl);
                            }
                            break;
                    }
                }
            });
        });
    </script>
</body>
</html>
