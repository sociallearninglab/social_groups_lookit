<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gazorp Experiment Player</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }
        .player-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #videoElement {
            max-width: 100%;
            max-height: 100%;
        }
        #startButton {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 30px;
            font-size: 18px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="player-container" id="playerContainer">
        <video id="videoElement" playsinline>
            <source src="" type="video/mp4">
        </video>
        <button id="startButton">Start Experiment</button>
    </div>

    <script>
        // Main configuration
        // Base URL for GitHub raw content
        const baseUrl = 'https://raw.githubusercontent.com/sociallearninglab/social_groups_lookit/main';
        const videoPath = `${baseUrl}/mp4`;
        const audioPath = `${baseUrl}/mp3`;
        
        // Debug mode
        const debugMode = true;
        
        // Elements
        const videoElement = document.getElementById('videoElement');
        const startButton = document.getElementById('startButton');
        const playerContainer = document.getElementById('playerContainer');
        
        // Audio elements cache
        const audioElements = {};
        const audioTracker = {}; // Track audio durations
        
        // Experiment configuration
        const experimentVersions = ['group_CD', 'group_Cx', 'group_xD', 'pref_CD', 'pref_Cx', 'pref_xD'];
        const groupCounterbalances = ['01', '02', '05', '06', '09', '10', '13', '14'];
        const prefCounterbalances = ['01', '03', '05', '07', '09', '11', '13', '15'];
        
        // Experiment state
        let currentVersion;
        let currentCB;
        let isGroupTask;
        let factors;
        let currentAudioQueue = [];
        let freezePoints = [];
        let currentFreezeIndex = 0;
        let isVideoFrozen = false;
        let currentScheduledTimeout = null;
        let audioEndTimeouts = []; // Store timeout IDs to clear them if needed
        
        // Default audio durations in seconds (if not detected at runtime)
        const defaultAudioDurations = {
            "intro_gazoom": 6,
            "intro_gazorps": 9,
            "red_team_first": 3,
            "blue_team_first": 3,
            "red_team_second": 3,
            "blue_team_second": 3,
            "question_point_red": 4,
            "question_point_blue": 4,
            "question_point_kiki": 4,
            "question_point_bubba": 4,
            "incorrect_red": 6,
            "incorrect_blue": 6,
            "incorrect_kiki": 6,
            "incorrect_bubba": 6,
            "good_job": 1.5,
            "fruits_intro": 6,
            "kiki_first": 4,
            "bubba_first": 4,
            "kiki_second": 4,
            "bubba_second": 4,
            "intro_snacktime": 10,
            "song_intro": 8
        };
        
        // Default audio script template - this will be customized based on counterbalance factors
        const audioScriptTemplate = {
            // Base script shared by all versions
            base: [
                // Slide 1: Introduction
                { time: 0, audio: "intro_gazoom", freeze_start: 4, freeze_end: 12.6 },
                
                // Slide 2: Team Introduction - Modified to have proper timing
                { time: 12.6, audio: "intro_gazorps", freeze_start: 13, freeze_end: null, duration: 9 },
                
                // Remaining slides will be added dynamically based on factors
            ]
        };
        
        // Counterbalance factor mappings
        const cbFactors = {
            group: {
                '01': { predicted_fruit: 'Kiki', predicted_team: 'Red', fruit_left: 'Kiki', team_first: 'Red' },
                '02': { predicted_fruit: 'Kiki', predicted_team: 'Blue', fruit_left: 'Kiki', team_first: 'Red' },
                '05': { predicted_fruit: 'Kiki', predicted_team: 'Red', fruit_left: 'Kiki', team_first: 'Blue' },
                '06': { predicted_fruit: 'Kiki', predicted_team: 'Blue', fruit_left: 'Kiki', team_first: 'Blue' },
                '09': { predicted_fruit: 'Kiki', predicted_team: 'Red', fruit_left: 'Bubba', team_first: 'Red' },
                '10': { predicted_fruit: 'Kiki', predicted_team: 'Blue', fruit_left: 'Bubba', team_first: 'Red' },
                '13': { predicted_fruit: 'Kiki', predicted_team: 'Red', fruit_left: 'Bubba', team_first: 'Blue' },
                '14': { predicted_fruit: 'Kiki', predicted_team: 'Blue', fruit_left: 'Bubba', team_first: 'Blue' }
            },
            pref: {
                '01': { predicted_fruit: 'Kiki', predicted_team: 'Red', fruit_left: 'Kiki', team_first: 'Red' },
                '03': { predicted_fruit: 'Bubba', predicted_team: 'Red', fruit_left: 'Kiki', team_first: 'Red' },
                '05': { predicted_fruit: 'Kiki', predicted_team: 'Red', fruit_left: 'Kiki', team_first: 'Blue' },
                '07': { predicted_fruit: 'Bubba', predicted_team: 'Red', fruit_left: 'Kiki', team_first: 'Blue' },
                '09': { predicted_fruit: 'Kiki', predicted_team: 'Red', fruit_left: 'Bubba', team_first: 'Red' },
                '11': { predicted_fruit: 'Bubba', predicted_team: 'Red', fruit_left: 'Bubba', team_first: 'Red' },
                '13': { predicted_fruit: 'Kiki', predicted_team: 'Red', fruit_left: 'Bubba', team_first: 'Blue' },
                '15': { predicted_fruit: 'Bubba', predicted_team: 'Red', fruit_left: 'Bubba', team_first: 'Blue' }
            }
        };
        
        // Log function
        function logDebug(message) {
            if (debugMode) {
                console.log(`[Gazorp] ${message}`);
            }
        }
        
        // Initialize experiment
        function initExperiment() {
            // Get experiment parameters from URL or randomly assign
            const params = new URLSearchParams(window.location.search);
            
            // Select version (group or pref + CD, Cx, or xD)
            let taskType = params.get('task') || (Math.random() < 0.5 ? 'group' : 'pref');
            let versionType = params.get('version') || ['CD', 'Cx', 'xD'][Math.floor(Math.random() * 3)];
            currentVersion = `${taskType}_${versionType}`;
            
            // Is this a group task?
            isGroupTask = taskType === 'group';
            
            // Select counterbalance
            const validCBs = isGroupTask ? groupCounterbalances : prefCounterbalances;
            currentCB = params.get('cb') || validCBs[Math.floor(Math.random() * validCBs.length)];
            
            // Get factors for this counterbalance
            factors = cbFactors[taskType][currentCB];
            
            // Set video source using the correct file structure based on the version
            const videoFolderName = `${versionType}_${taskType}`;
            
            // All videos now use .mp4 format following conversion
            let videoFileName;
            
            if (versionType === 'CD') {
                // For CD files: CD_[taskType]_CB[cb].mp4
                videoFileName = `${versionType}_${taskType}_CB${currentCB}.mp4`;
            } else {
                // For other files: [taskType]_[versionType]_CB[cb].mp4 (was .mov before conversion)
                videoFileName = `${taskType}_${versionType}_CB${currentCB}.mp4`;
            }
            
            const videoFilePath = `${videoPath}/${videoFolderName}/${videoFileName}`;
            
            // Set the video source
            const sourceElement = videoElement.querySelector('source');
            sourceElement.src = videoFilePath;
            sourceElement.type = "video/mp4";
            
            // Log experiment setup
            logDebug(`Experiment setup: ${currentVersion}, CB${currentCB}`);
            logDebug(`Factors: ${JSON.stringify(factors)}`);
            logDebug(`Video: ${videoFilePath}`);
            
            // Build the customized audio script for this condition
            buildAudioScript();
            
            // Set up event listeners
            setupEventListeners();
            
            // Load video
            videoElement.load();
        }
        
        function buildAudioScript() {
            // Start with the base script
            let script = [...audioScriptTemplate.base];
            
            // Add team introduction based on factors
            // The intro_gazorps audio finishes at 21.6s (12.6 + 9s duration)
            
            const firstTeamStart = 22; // Start right after intro_gazorps ends
            
            if (factors.team_first === 'Red') {
                script.push(
                    // First team audio
                    { time: firstTeamStart, audio: "red_team_first", freeze_start: null, freeze_end: 24, duration: 3 },
                    // Second team audio - starts after first team audio ends (~25s)
                    { time: firstTeamStart + 3, audio: "blue_team_second", freeze_start: firstTeamStart + 3, freeze_end: null, duration: 3 }
                );
            } else {
                script.push(
                    // First team audio
                    { time: firstTeamStart, audio: "blue_team_first", freeze_start: null, freeze_end: 24, duration: 3 },
                    // Second team audio - starts after first team audio ends (~25s)
                    { time: firstTeamStart + 3, audio: "red_team_second", freeze_start: firstTeamStart + 3, freeze_end: null, duration: 3 }
                );
            }
            
            // Team questions - Both teams have questions at fixed time 29
            // We'll freeze the video, play first team question, wait 5s, play incorrect,
            // wait 1s, play second team question, wait 5s, play second incorrect
            
            const questionStart = 29;
            
            if (factors.fruit_left === 'Kiki') {
                // Kiki (Red) team on left, Bubba (Blue) team on right
                script.push(
                    // First question (for left team)
                    { 
                        time: questionStart, 
                        audio: "question_point_red", 
                        freeze_start: questionStart, 
                        freeze_end: null, 
                        duration: 4,
                        onEnd: () => {
                            // Schedule incorrect after 5s gap
                            setTimeout(() => {
                                playAudio("incorrect_red");
                                logDebug(`Playing incorrect_red audio 5s after question_point_red`);
                                
                                // Schedule second question 1s after incorrect_red ends (~6s duration)
                                setTimeout(() => {
                                    playAudio("question_point_blue");
                                    logDebug(`Playing question_point_blue audio`);
                                    
                                    // Schedule second incorrect 5s after question_point_blue ends
                                    setTimeout(() => {
                                        playAudio("incorrect_blue");
                                        logDebug(`Playing incorrect_blue audio`);
                                        
                                        // Unfreeze video after incorrect_blue ends (~6s duration)
                                        setTimeout(() => {
                                            if (isVideoFrozen) {
                                                unfreezeVideo();
                                                isVideoFrozen = false;
                                                currentFreezeIndex++;
                                                logDebug(`Unfreezing video after team questions`);
                                            }
                                        }, 6000);
                                    }, 4000 + 5000); // question_blue duration + 5s gap
                                }, 6000 + 1000); // incorrect_red duration + 1s gap
                            }, 4000 + 5000); // question_red duration + 5s gap
                        }
                    }
                );
            } else {
                // Bubba (Blue) team on left, Kiki (Red) team on right
                script.push(
                    // First question (for left team)
                    { 
                        time: questionStart, 
                        audio: "question_point_blue", 
                        freeze_start: questionStart, 
                        freeze_end: null, 
                        duration: 4,
                        onEnd: () => {
                            // Schedule incorrect after 5s gap
                            setTimeout(() => {
                                playAudio("incorrect_blue");
                                logDebug(`Playing incorrect_blue audio 5s after question_point_blue`);
                                
                                // Schedule second question 1s after incorrect_blue ends (~6s duration)
                                setTimeout(() => {
                                    playAudio("question_point_red");
                                    logDebug(`Playing question_point_red audio`);
                                    
                                    // Schedule second incorrect 5s after question_point_red ends
                                    setTimeout(() => {
                                        playAudio("incorrect_red");
                                        logDebug(`Playing incorrect_red audio`);
                                        
                                        // Unfreeze video after incorrect_red ends (~6s duration)
                                        setTimeout(() => {
                                            if (isVideoFrozen) {
                                                unfreezeVideo();
                                                isVideoFrozen = false;
                                                currentFreezeIndex++;
                                                logDebug(`Unfreezing video after team questions`);
                                            }
                                        }, 6000);
                                    }, 4000 + 5000); // question_red duration + 5s gap
                                }, 6000 + 1000); // incorrect_blue duration + 1s gap
                            }, 4000 + 5000); // question_blue duration + 5s gap
                        }
                    }
                );
            }
            
            // Add fruit introduction and remaining script...
            // (I'm keeping this simpler for this fix, focusing on the initial timing issues)
            script.push(
                // Slide 4: Fruit Introduction
                { time: 62, audio: "fruits_intro", freeze_start: 62, freeze_end: 72 }
            );
            
            // Set the current audio queue
            currentAudioQueue = [...script];
            
            // Extract freeze points (excluding those handled by callbacks)
            freezePoints = script
                .filter(item => item.freeze_start !== null && item.freeze_end !== null)
                .map(item => ({ start: item.freeze_start, end: item.freeze_end }));
            
            // Sort by time
            currentAudioQueue.sort((a, b) => a.time - b.time);
            freezePoints.sort((a, b) => a.start - b.start);
            
            logDebug(`Prepared ${currentAudioQueue.length} audio events and ${freezePoints.length} freeze points`);
        }
        
        function setupEventListeners() {
            // Video events
            videoElement.addEventListener('loadedmetadata', onVideoLoaded);
            videoElement.addEventListener('timeupdate', onTimeUpdate);
            videoElement.addEventListener('ended', onVideoEnded);
            videoElement.addEventListener('error', onVideoError);
            videoElement.addEventListener('play', () => logDebug('Video playback started'));
            videoElement.addEventListener('pause', () => logDebug('Video playback paused'));
            
            // Start button
            startButton.addEventListener('click', startPlayback);
            
            // Message handlers for Lookit
            window.addEventListener('message', onMessageReceived);
            
            // Add spacebar control to pause/play
            document.addEventListener('keydown', (event) => {
                if (event.code === 'Space') {
                    event.preventDefault();
                    if (videoElement.paused) {
                        videoElement.play();
                        logDebug('Video resumed via spacebar');
                    } else {
                        videoElement.pause();
                        logDebug('Video paused via spacebar');
                    }
                }
            });
        }
        
        function onVideoError(e) {
            logDebug(`Video error: ${videoElement.error ? videoElement.error.message : 'Unknown error'}`);
            logDebug(`Error code: ${videoElement.error ? videoElement.error.code : 'N/A'}`);
            logDebug(`Current src: ${videoElement.currentSrc}`);
        }
        
        function onVideoLoaded() {
            logDebug('Video loaded, ready to play');
            
            // Create and preload all audio elements
            preloadAudio();
            
            // Auto-start if specified in URL
            if (new URLSearchParams(window.location.search).get('autostart') === 'true') {
                startPlayback();
            }
        }
        
        function preloadAudio() {
            // Create a Set of unique audio files needed
            const uniqueAudio = new Set();
            currentAudioQueue.forEach(item => uniqueAudio.add(item.audio));
            
            // Add required incorrect audios
            uniqueAudio.add("incorrect_red");
            uniqueAudio.add("incorrect_blue");
            
            // Create audio elements for each file
            uniqueAudio.forEach(audioFile => {
                const audio = new Audio(`${audioPath}/${audioFile}.mp3`);
                audio.preload = 'auto';
                
                // Track when audio can play through to get duration
                audio.addEventListener('canplaythrough', () => {
                    audioTracker[audioFile] = audio.duration;
                    logDebug(`Audio ${audioFile}.mp3 duration: ${audio.duration.toFixed(2)}s`);
                });
                
                // Track errors
                audio.addEventListener('error', () => {
                    logDebug(`Error loading audio: ${audioFile}.mp3`);
                    // Use default duration as fallback
                    audioTracker[audioFile] = defaultAudioDurations[audioFile] || 3;
                });
                
                audioElements[audioFile] = audio;
            });
            
            logDebug(`Preloading ${uniqueAudio.size} audio files`);
        }
        
        function startPlayback() {
            // Hide start button
            startButton.style.display = 'none';
            
            // Reset state
            videoElement.currentTime = 0;
            currentFreezeIndex = 0;
            isVideoFrozen = false;
            
            // Clear any existing timeouts
            audioEndTimeouts.forEach(timeoutId => clearTimeout(timeoutId));
            audioEndTimeouts = [];
            
            // Reset all audio elements
            Object.values(audioElements).forEach(audio => {
                audio.pause();
                audio.currentTime = 0;
            });
            
            // Reset played flags on audio queue
            currentAudioQueue.forEach(item => item.played = false);
            
            // Start playback
            videoElement.play();
            logDebug('Playback started');
        }
        
        // Last video time for debug logging
        let lastLoggedTime = -1;
        
        function onTimeUpdate() {
            const currentTime = videoElement.currentTime;
            
            // Log current time every second for debugging
            if (Math.floor(currentTime) > Math.floor(lastLoggedTime)) {
                logDebug(`Video time: ${currentTime.toFixed(2)}s`);
                lastLoggedTime = currentTime;
            }
            
            // Check for audio events
            checkAudioEvents(currentTime);
            
            // Check for freeze points
            checkFreezePoints(currentTime);
        }
        
        function checkAudioEvents(currentTime) {
            // Find audio events that should play
            for (let i = 0; i < currentAudioQueue.length; i++) {
                const event = currentAudioQueue[i];
                
                // If we're within 0.1 second of the event time and the audio hasn't played yet
                if (Math.abs(currentTime - event.time) < 0.1 && !event.played) {
                    playAudioWithCallback(event.audio, event.onEnd);
                    event.played = true;
                    logDebug(`[AUDIO] Playing audio: "${event.audio}" at ${currentTime.toFixed(2)}s`);
                    
                    // If this audio has a duration and onEnd callback, schedule it
                    if (event.duration && typeof event.onEnd === 'function') {
                        const duration = audioTracker[event.audio] || event.duration;
                        const timeoutId = setTimeout(() => {
                            event.onEnd();
                        }, duration * 1000);
                        audioEndTimeouts.push(timeoutId);
                    }
                }
            }
        }
        
        function checkFreezePoints(currentTime) {
            // Skip if we're already at the end of freeze points
            if (currentFreezeIndex >= freezePoints.length) return;
            
            const freezePoint = freezePoints[currentFreezeIndex];
            
            // If we've reached the start of a freeze point and we're not already frozen
            if (currentTime >= freezePoint.start && !isVideoFrozen) {
                freezeVideo();
                isVideoFrozen = true;
                logDebug(`[FREEZE] Freezing video at ${currentTime.toFixed(2)}s until ${freezePoint.end}s`);
                
                // If there is an end time, schedule unfreezing
                if (freezePoint.end !== null) {
                    setTimeout(() => {
                        if (isVideoFrozen) {
                            unfreezeVideo();
                            isVideoFrozen = false;
                            currentFreezeIndex++;
                            logDebug(`[UNFREEZE] Unfreezing video to continue at ${freezePoint.end}s`);
                            
                            // Set current time to end of freeze
                            videoElement.currentTime = freezePoint.end;
                        }
                    }, (freezePoint.end - freezePoint.start) * 1000);
                }
            }
        }
        
        function freezeVideo() {
            // Pause the video to freeze it
            videoElement.pause();
        }
        
        function unfreezeVideo() {
            // Resume video playback
            videoElement.play()
                .catch(error => {
                    logDebug(`Error resuming playback after freeze: ${error.message}`);
                });
        }
        
        function playAudio(audioName) {
            playAudioWithCallback(audioName, null);
        }
        
        function playAudioWithCallback(audioName, callback) {
            // Get audio element
            const audio = audioElements[audioName];
            
            if (audio) {
                // Reset to beginning
                audio.currentTime = 0;
                
                // Add ended callback if provided
                if (typeof callback === 'function') {
                    const onEnded = () => {
                        callback();
                        audio.removeEventListener('ended', onEnded);
                    };
                    audio.addEventListener('ended', onEnded);
                }
                
                // Play the audio
                audio.play()
                    .then(() => {
                        // Successfully started playing
                        logDebug(`Audio "${audioName}" started playing`);
                    })
                    .catch(error => {
                        logDebug(`Error playing audio ${audioName}: ${error.message}`);
                    });
            } else {
                logDebug(`Audio not found: ${audioName}`);
            }
        }
        
        function onVideoEnded() {
            logDebug('Video playback ended');
            
            // Tell parent frame to move to next step if applicable
            try {
                window.parent.postMessage({
                    type: 'nextFrame'
                }, '*');
                logDebug('Sent nextFrame message to parent');
            } catch (err) {
                logDebug(`Error sending message to parent: ${err.message}`);
            }
        }
        
        function onMessageReceived(event) {
            if (event.data && event.data.type) {
                logDebug(`Received message: ${event.data.type}`);
                
                switch (event.data.type) {
                    case 'play':
                        videoElement.play();
                        logDebug('Received play command');
                        break;
                        
                    case 'pause':
                        videoElement.pause();
                        logDebug('Received pause command');
                        break;
                        
                    case 'setCondition':
                        // Reload page with new condition
                        if (event.data.version && event.data.cb) {
                            logDebug(`Received setCondition: version=${event.data.version}, cb=${event.data.cb}`);
                            const url = new URL(window.location);
                            url.searchParams.set('task', event.data.version.split('_')[0]);
                            url.searchParams.set('version', event.data.version.split('_')[1]);
                            url.searchParams.set('cb', event.data.cb);
                            logDebug(`Redirecting to: ${url.toString()}`);
                            window.location.href = url.toString();
                        }
                        break;
                }
            }
        }
        
        // Start initialization when document is ready
        document.addEventListener('DOMContentLoaded', initExperiment);
    </script>
</body>
</html>
