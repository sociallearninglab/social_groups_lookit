<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gazorp Custom Experiment Player</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
        }
        .player-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #videoElement {
            max-width: 100%;
            max-height: 100%;
            display: none; /* Hide the actual video element */
        }
        #canvasElement {
            max-width: 100%;
            max-height: 100%;
            background-color: #000;
        }
        #freezeCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }
        #startButton {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 30px;
            font-size: 18px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            z-index: 100;
        }
        #loadingMessage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            text-align: center;
        }
        #controlBar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            background-color: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            z-index: 100;
        }
        #playPauseButton {
            background-color: transparent;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-right: 10px;
        }
        #timeDisplay {
            color: white;
            margin-right: 10px;
            font-size: 14px;
            line-height: 24px;
        }
        #progressBar {
            width: 300px;
            height: 10px;
            background-color: #333;
            border-radius: 5px;
            margin-top: 7px;
            cursor: pointer;
        }
        #progressFill {
            height: 100%;
            background-color: #4CAF50;
            border-radius: 5px;
            width: 0%;
        }
    </style>
</head>
<body>
    <div class="player-container" id="playerContainer">
        <!-- Hidden video element to load and decode the video -->
        <video id="videoElement" preload="auto" crossorigin="anonymous">
            <source src="" type="video/mp4">
        </video>
        
        <!-- Canvas to display the video frames -->
        <canvas id="canvasElement"></canvas>
        
        <!-- Canvas for freeze frames -->
        <canvas id="freezeCanvas"></canvas>
        
        <!-- UI Elements -->
        <button id="startButton">Start Experiment</button>
        <div id="loadingMessage">Loading video...</div>
        
        <!-- Control bar -->
        <div id="controlBar" style="display: none;">
            <button id="playPauseButton">❚❚</button>
            <div id="timeDisplay">0:00 / 0:00</div>
            <div id="progressBar">
                <div id="progressFill"></div>
            </div>
        </div>
    </div>

    <script>
        // Main configuration
        const baseUrl = 'https://raw.githubusercontent.com/sociallearninglab/social_groups_lookit/main';
        const videoPath = `${baseUrl}/mp4`;
        const audioPath = `${baseUrl}/mp3`;
        
        // Debug mode
        const debugMode = true;
        
        // Elements
        const videoElement = document.getElementById('videoElement');
        const canvasElement = document.getElementById('canvasElement');
        const freezeCanvas = document.getElementById('freezeCanvas');
        const startButton = document.getElementById('startButton');
        const loadingMessage = document.getElementById('loadingMessage');
        const playerContainer = document.getElementById('playerContainer');
        const controlBar = document.getElementById('controlBar');
        const playPauseButton = document.getElementById('playPauseButton');
        const timeDisplay = document.getElementById('timeDisplay');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        
        // Set up canvas contexts
        const ctx = canvasElement.getContext('2d');
        const freezeCtx = freezeCanvas.getContext('2d');
        
        // Audio elements cache
        const audioElements = {};
        
        // Experiment configuration
        const experimentVersions = ['group_CD', 'group_Cx', 'group_xD', 'pref_CD', 'pref_Cx', 'pref_xD'];
        const groupCounterbalances = ['01', '02', '05', '06', '09', '10', '13', '14'];
        const prefCounterbalances = ['01', '03', '05', '07', '09', '11', '13', '15'];
        
        // Player state
        let currentVersion;
        let currentCB;
        let isGroupTask;
        let factors;
        let isPlaying = false;
        let isFrozen = false;
        let currentTime = 0;
        let lastFrameTime = 0;
        let videoDuration = 0;
        let videoWidth = 0;
        let videoHeight = 0;
        let animationFrameId = null;
        let freezeTimeline = []; // Array of {start, end} times to freeze the video
        let audioTimeline = []; // Array of {time, audio, duration} to trigger audio
        
        // Custom frozen state tracking
        let activeFreezePoint = null;
        let freezeFrameCaptured = false;
        
        // Log function
        function logDebug(message) {
            if (debugMode) {
                console.log(`[Gazorp] ${message}`);
            }
        }
        
        // Initialize experiment
        function initExperiment() {
            logDebug('Initializing experiment...');
            
            // Get experiment parameters from URL or randomly assign
            const params = new URLSearchParams(window.location.search);
            
            // Select version (group or pref + CD, Cx, or xD)
            let taskType = params.get('task') || (Math.random() < 0.5 ? 'group' : 'pref');
            let versionType = params.get('version') || ['CD', 'Cx', 'xD'][Math.floor(Math.random() * 3)];
            currentVersion = `${taskType}_${versionType}`;
            
            // Is this a group task?
            isGroupTask = taskType === 'group';
            
            // Select counterbalance
            const validCBs = isGroupTask ? groupCounterbalances : prefCounterbalances;
            currentCB = params.get('cb') || validCBs[Math.floor(Math.random() * validCBs.length)];
            
            // Get factors for this counterbalance
            factors = cbFactors[taskType][currentCB];
            
            // Set video source using the correct file structure
            const videoFolderName = `${versionType}_${taskType}`;
            
            let videoFileName;
            if (versionType === 'CD') {
                videoFileName = `${versionType}_${taskType}_CB${currentCB}.mp4`;
            } else {
                videoFileName = `${taskType}_${versionType}_CB${currentCB}.mp4`;
            }
            
            const videoFilePath = `${videoPath}/${videoFolderName}/${videoFileName}`;
            
            // Set the video source
            const sourceElement = videoElement.querySelector('source');
            sourceElement.src = videoFilePath;
            
            logDebug(`Experiment setup: ${currentVersion}, CB${currentCB}`);
            logDebug(`Video: ${videoFilePath}`);
            
            // Create freeze and audio timelines based on factors
            createTimelines();
            
            // Set up event listeners
            setupEventListeners();
            
            // Load video
            videoElement.load();
        }
        
        // Counterbalance factors
        const cbFactors = {
            group: {
                '01': { predicted_fruit: 'Kiki', predicted_team: 'Red', fruit_left: 'Kiki', team_first: 'Red' },
                '02': { predicted_fruit: 'Kiki', predicted_team: 'Blue', fruit_left: 'Kiki', team_first: 'Red' },
                '05': { predicted_fruit: 'Kiki', predicted_team: 'Red', fruit_left: 'Kiki', team_first: 'Blue' },
                '06': { predicted_fruit: 'Kiki', predicted_team: 'Blue', fruit_left: 'Kiki', team_first: 'Blue' },
                '09': { predicted_fruit: 'Kiki', predicted_team: 'Red', fruit_left: 'Bubba', team_first: 'Red' },
                '10': { predicted_fruit: 'Kiki', predicted_team: 'Blue', fruit_left: 'Bubba', team_first: 'Red' },
                '13': { predicted_fruit: 'Kiki', predicted_team: 'Red', fruit_left: 'Bubba', team_first: 'Blue' },
                '14': { predicted_fruit: 'Kiki', predicted_team: 'Blue', fruit_left: 'Bubba', team_first: 'Blue' }
            },
            pref: {
                '01': { predicted_fruit: 'Kiki', predicted_team: 'Red', fruit_left: 'Kiki', team_first: 'Red' },
                '03': { predicted_fruit: 'Bubba', predicted_team: 'Red', fruit_left: 'Kiki', team_first: 'Red' },
                '05': { predicted_fruit: 'Kiki', predicted_team: 'Red', fruit_left: 'Kiki', team_first: 'Blue' },
                '07': { predicted_fruit: 'Bubba', predicted_team: 'Red', fruit_left: 'Kiki', team_first: 'Blue' },
                '09': { predicted_fruit: 'Kiki', predicted_team: 'Red', fruit_left: 'Bubba', team_first: 'Red' },
                '11': { predicted_fruit: 'Bubba', predicted_team: 'Red', fruit_left: 'Bubba', team_first: 'Red' },
                '13': { predicted_fruit: 'Kiki', predicted_team: 'Red', fruit_left: 'Bubba', team_first: 'Blue' },
                '15': { predicted_fruit: 'Bubba', predicted_team: 'Red', fruit_left: 'Bubba', team_first: 'Blue' }
            }
        };
        
        // Create timelines based on XML data and condition factors
        function createTimelines() {
            // Clear existing timelines
            freezeTimeline = [];
            audioTimeline = [];
            
            // These freeze points are based on the XML file - consistent across all versions
            freezeTimeline = [
                { start: 4.0, end: 12.6 },     // Introduction freeze
                { start: 13.0, end: 24.0 },    // Team introduction freeze
                { start: 29.0, end: 34.0 },    // Team questions freeze (first team)
                { start: 51.0, end: 56.0 },    // Team questions freeze (second team)
                { start: 62.0, end: 72.0 },    // Fruit introduction freeze
                { start: 80.0, end: 89.0 },    // Fruit questions freeze (first fruit)
                { start: 95.0, end: 101.0 },   // Fruit questions freeze (second fruit)
                { start: 107.0, end: 136.0 },  // Snack time introduction freeze
                { start: 138.0, end: 142.0 },  // First team sequence freeze 1
                { start: 158.0, end: 162.0 },  // First team sequence freeze 2
                { start: 172.0, end: 176.0 },  // First team sequence freeze 3
                { start: 208.0, end: 212.0 },  // First team sequence freeze 4
                { start: 236.0, end: 251.0 },  // First team summary freeze
                { start: 265.0, end: 269.0 },  // Second team sequence freeze 1
                { start: 283.0, end: 287.0 },  // Second team sequence freeze 2
                { start: 300.0, end: 304.0 },  // Second team sequence freeze 3
                { start: 320.0, end: 324.0 },  // Second team sequence freeze 4
                { start: 362.0, end: 372.0 },  // Second team summary freeze
                { start: 386.0, end: 401.0 },  // Final review freeze (first team)
                { start: 411.0, end: 415.0 },  // Final review freeze (second team)
                { start: 431.0, end: 436.0 },  // Test question freeze 1
                { start: 456.0, end: 463.0 }   // Test question freeze 2
            ];
            
            // Basic audio timeline consistent across versions
            const baseAudioTimeline = [
                { time: 0.0, audio: "intro_gazoom", duration: 12.6 },
                { time: 12.6, audio: "intro_gazorps", duration: 8.4 },
                { time: 62.0, audio: "fruits_intro", duration: 10.0 },
                { time: 107.0, audio: "intro_snacktime", duration: 16.0 },
                { time: 123.0, audio: "song_intro", duration: 13.0 },
                { time: 397.0, audio: "transition_all", duration: 15.0 },
                { time: 438.0, audio: "test_new_gazorp", duration: 5.0 },
                { time: 443.0, audio: "test_lost_shirt", duration: 12.0 },
                { time: 455.0, audio: "oh_wow", duration: 2.0 },
                { time: 473.0, audio: "so_question", duration: 4.0 },
                { time: 477.0, audio: "why_team", duration: 2.0 }
            ];
            
            // Initialize audio timeline with base events
            audioTimeline = [...baseAudioTimeline];
            
            // First team vs second team audio depending on team_first factor
            if (factors.team_first === 'Red') {
                // Red team first
                audioTimeline.push({ time: 21.0, audio: "red_team_first", duration: 3.0 });
                audioTimeline.push({ time: 25.0, audio: "blue_team_second", duration: 3.0 });
                audioTimeline.push({ time: 136.0, audio: "song_red_start", duration: 14.0 });
                audioTimeline.push({ time: 159.0, audio: "song_red_start", duration: 14.0 });
                audioTimeline.push({ time: 182.0, audio: "song_red_start", duration: 14.0 });
                audioTimeline.push({ time: 208.0, audio: "song_red_start", duration: 14.0 });
                audioTimeline.push({ time: 236.0, audio: "summary_red", duration: 15.0 });
                audioTimeline.push({ time: 260.0, audio: "transition_blue", duration: 5.0 });
                audioTimeline.push({ time: 265.0, audio: "song_blue_start", duration: 14.0 });
                audioTimeline.push({ time: 290.0, audio: "song_blue_start", duration: 14.0 });
                audioTimeline.push({ time: 316.0, audio: "song_blue_start", duration: 14.0 });
                audioTimeline.push({ time: 345.0, audio: "song_blue_start", duration: 14.0 });
                audioTimeline.push({ time: 362.0, audio: "summary_blue", duration: 15.0 });
                audioTimeline.push({ time: 412.0, audio: "review_red", duration: 4.0 });
                audioTimeline.push({ time: 425.0, audio: "review_blue", duration: 4.0 });
                
                // Add count audio - Red Team first
                audioTimeline.push({ time: 149.0, audio: "count_red_one", duration: 3.0 });
                audioTimeline.push({ time: 174.0, audio: "count_red_two", duration: 3.0 });
                audioTimeline.push({ time: 197.0, audio: "count_red_three", duration: 3.0 });
                audioTimeline.push({ time: 223.0, audio: "count_red_four", duration: 4.0 });
                
                // Then Blue Team 
                audioTimeline.push({ time: 280.0, audio: "count_blue_one", duration: 4.0 });
                audioTimeline.push({ time: 305.0, audio: "count_blue_two", duration: 3.0 });
                audioTimeline.push({ time: 331.0, audio: "count_blue_three", duration: 4.0 });
                audioTimeline.push({ time: 360.0, audio: "count_blue_four", duration: 3.0 });
            } else {
                // Blue team first
                audioTimeline.push({ time: 21.0, audio: "blue_team_first", duration: 3.0 });
                audioTimeline.push({ time: 25.0, audio: "red_team_second", duration: 3.0 });
                audioTimeline.push({ time: 136.0, audio: "song_blue_start", duration: 14.0 });
                audioTimeline.push({ time: 159.0, audio: "song_blue_start", duration: 14.0 });
                audioTimeline.push({ time: 182.0, audio: "song_blue_start", duration: 14.0 });
                audioTimeline.push({ time: 208.0, audio: "song_blue_start", duration: 14.0 });
                audioTimeline.push({ time: 236.0, audio: "summary_blue", duration: 15.0 });
                audioTimeline.push({ time: 260.0, audio: "transition_red", duration: 5.0 });
                audioTimeline.push({ time: 265.0, audio: "song_red_start", duration: 14.0 });
                audioTimeline.push({ time: 290.0, audio: "song_red_start", duration: 14.0 });
                audioTimeline.push({ time: 316.0, audio: "song_red_start", duration: 14.0 });
                audioTimeline.push({ time: 345.0, audio: "song_red_start", duration: 14.0 });
                audioTimeline.push({ time: 362.0, audio: "summary_red", duration: 15.0 });
                audioTimeline.push({ time: 412.0, audio: "review_blue", duration: 4.0 });
                audioTimeline.push({ time: 425.0, audio: "review_red", duration: 4.0 });
                
                // Add count audio - Blue Team first
                audioTimeline.push({ time: 149.0, audio: "count_blue_one", duration: 3.0 });
                audioTimeline.push({ time: 174.0, audio: "count_blue_two", duration: 3.0 });
                audioTimeline.push({ time: 197.0, audio: "count_blue_three", duration: 3.0 });
                audioTimeline.push({ time: 223.0, audio: "count_blue_four", duration: 4.0 });
                
                // Then Red Team 
                audioTimeline.push({ time: 280.0, audio: "count_red_one", duration: 4.0 });
                audioTimeline.push({ time: 305.0, audio: "count_red_two", duration: 3.0 });
                audioTimeline.push({ time: 331.0, audio: "count_red_three", duration: 4.0 });
                audioTimeline.push({ time: 360.0, audio: "count_red_four", duration: 3.0 });
            }
            
            // Add fruit audio based on left_fruit factor
            if (factors.fruit_left === 'Kiki') {
                // Kiki on left, Bubba on right
                audioTimeline.push({ time: 72.0, audio: "kiki_first", duration: 5.0 });
                audioTimeline.push({ time: 77.0, audio: "bubba_second", duration: 3.0 });
                audioTimeline.push({ time: 80.0, audio: "question_click_kiki", duration: 5.0 });
                audioTimeline.push({ time: 85.0, audio: "incorrect_kiki", duration: 10.0 });
                audioTimeline.push({ time: 95.0, audio: "question_click_bubba", duration: 5.0 });
                audioTimeline.push({ time: 95.0, audio: "incorrect_bubba", duration: 6.0 });
            } else {
                // Bubba on left, Kiki on right
                audioTimeline.push({ time: 72.0, audio: "bubba_first", duration: 5.0 });
                audioTimeline.push({ time: 77.0, audio: "kiki_second", duration: 3.0 });
                audioTimeline.push({ time: 80.0, audio: "question_click_bubba", duration: 5.0 });
                audioTimeline.push({ time: 85.0, audio: "incorrect_bubba", duration: 10.0 });
                audioTimeline.push({ time: 95.0, audio: "question_click_kiki", duration: 5.0 });
                audioTimeline.push({ time: 95.0, audio: "incorrect_kiki", duration: 6.0 });
            }
            
            // Team questions sequence depends on team_first and fruit_left
            if (factors.team_first === 'Red') {
                // Red first, so Red on left
                audioTimeline.push({ time: 29.0, audio: "question_click_red", duration: 5.0 });
                audioTimeline.push({ time: 34.0, audio: "incorrect_red", duration: 13.0 });
                audioTimeline.push({ time: 47.0, audio: "question_click_blue", duration: 4.0 });
                audioTimeline.push({ time: 56.0, audio: "incorrect_blue", duration: 6.0 });
            } else {
                // Blue first, so Blue on left
                audioTimeline.push({ time: 29.0, audio: "question_click_blue", duration: 5.0 });
                audioTimeline.push({ time: 34.0, audio: "incorrect_blue", duration: 13.0 });
                audioTimeline.push({ time: 47.0, audio: "question_click_red", duration: 4.0 });
                audioTimeline.push({ time: 56.0, audio: "incorrect_red", duration: 6.0 });
            }
            
            // Add experiment type specific audio
            if (isGroupTask) {
                // For infer_group, we ask about fruit and infer team
                if (factors.predicted_fruit === 'Kiki') {
                    audioTimeline.push({ time: 457.0, audio: "question_like_what_kiki", duration: 5.0 });
                } else {
                    audioTimeline.push({ time: 457.0, audio: "question_like_what_bubba", duration: 5.0 });
                }
                audioTimeline.push({ time: 462.0, audio: "click_fruit", duration: 5.0 });
                
                // Final team answer
                if (factors.predicted_team === 'Red') {
                    audioTimeline.push({ time: 479.0, audio: "red_team", duration: 2.0 });
                } else {
                    audioTimeline.push({ time: 479.0, audio: "blue_team", duration: 2.0 });
                }
            } else {
                // For infer_pref, we ask about team and infer fruit
                if (factors.predicted_team === 'Red') {
                    audioTimeline.push({ time: 457.0, audio: "question_team_red", duration: 5.0 });
                } else {
                    audioTimeline.push({ time: 457.0, audio: "question_team_blue", duration: 5.0 });
                }
                audioTimeline.push({ time: 462.0, audio: "click_team", duration: 5.0 });
                audioTimeline.push({ time: 467.0, audio: "click_team_correct", duration: 5.0 });
                
                // Final fruit answer
                if (factors.predicted_fruit === 'Kiki') {
                    audioTimeline.push({ time: 479.0, audio: "kiki", duration: 1.0 });
                } else {
                    audioTimeline.push({ time: 479.0, audio: "bubba", duration: 1.0 });
                }
            }
            
            // Add kiki/bubba sounds throughout - times from XML
            const fruitSoundTimes = [
                148.0, 152.0, 173.0, 177.0, 179.0, 196.0, 200.0, 202.0, 204.0, 222.0, 227.0, 229.0, 231.0, 
                233.0, 251.0, 253.0, 256.0, 258.0, 279.0, 284.0, 304.0, 308.0, 310.0, 330.0, 335.0, 337.0, 
                339.0, 359.0, 363.0, 365.0, 367.0, 369.0, 387.0, 389.0, 392.0, 394.0, 416.0, 418.0, 421.0, 
                423.0, 429.0, 431.0, 434.0, 436.0, 472.0
            ];
            
            // Add fruit sounds based on task and predicted fruit
            fruitSoundTimes.forEach(time => {
                const predictedFruit = factors.predicted_fruit === 'Kiki' ? "kiki" : "bubba";
                audioTimeline.push({ time: time, audio: predictedFruit, duration: 1.0 });
            });
            
            // Sort audio timeline by time
            audioTimeline.sort((a, b) => a.time - b.time);
            
            logDebug(`Created ${freezeTimeline.length} freeze points and ${audioTimeline.length} audio events`);
        }
        
        function setupEventListeners() {
            // Video events
            videoElement.addEventListener('loadedmetadata', onVideoLoaded);
            videoElement.addEventListener('error', onVideoError);
            
            // Start button
            startButton.addEventListener('click', startPlayback);
            
            // Controls
            playPauseButton.addEventListener('click', togglePlayPause);
            progressBar.addEventListener('click', seekVideo);
            
            // Message handlers for Lookit
            window.addEventListener('message', onMessageReceived);
            
            // Add spacebar control to pause/play
            document.addEventListener('keydown', (event) => {
                if (event.code === 'Space') {
                    event.preventDefault();
                    togglePlayPause();
                }
            });
            
            // Window resize handler
            window.addEventListener('resize', updateCanvasSize);
        }
        
        function onVideoError(e) {
            logDebug(`Video error: ${videoElement.error ? videoElement.error.message : 'Unknown error'}`);
            loadingMessage.textContent = `Error loading video: ${videoElement.error ? videoElement.error.code : 'Unknown error'}`;
        }
        
        function onVideoLoaded() {
            // Get video dimensions and duration
            videoWidth = videoElement.videoWidth;
            videoHeight = videoElement.videoHeight;
            videoDuration = videoElement.duration;
            
            logDebug(`Video loaded: ${videoWidth}x${videoHeight}, ${videoDuration.toFixed(2)}s`);
            
            // Set canvas sizes
            canvasElement.width = videoWidth;
            canvasElement.height = videoHeight;
            freezeCanvas.width = videoWidth;
            freezeCanvas.height = videoHeight;
            
            // Update display sizes
            updateCanvasSize();
            
            // Hide loading message
            loadingMessage.style.display = 'none';
            
            // Enable start button
            startButton.disabled = false;
            
            // Format duration in time display
            timeDisplay.textContent = `0:00 / ${formatTime(videoDuration)}`;
            
            // Preload audio files
            preloadAudio();
            
            // Auto-start if specified in URL
            if (new URLSearchParams(window.location.search).get('autostart') === 'true') {
                startPlayback();
            }
        }
        
        function updateCanvasSize() {
            // Maintain aspect ratio while fitting in container
            const container = playerContainer;
            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;
            
            let canvasWidth, canvasHeight;
            
            // If video dimensions are available, use them
            if (videoWidth > 0 && videoHeight > 0) {
                const aspectRatio = videoWidth / videoHeight;
                
                if (containerWidth / containerHeight > aspectRatio) {
                    // Container is wider than video
                    canvasHeight = containerHeight;
                    canvasWidth = canvasHeight * aspectRatio;
                } else {
                    // Container is taller than video
                    canvasWidth = containerWidth;
                    canvasHeight = canvasWidth / aspectRatio;
                }
            } else {
                // Default size if video dimensions not available
                canvasWidth = containerWidth;
                canvasHeight = containerHeight;
            }
            
            // Apply sizes to display elements
            canvasElement.style.width = `${canvasWidth}px`;
            canvasElement.style.height = `${canvasHeight}px`;
            freezeCanvas.style.width = `${canvasWidth}px`;
            freezeCanvas.style.height = `${canvasHeight}px`;

            // If video is playing, draw current frame with new dimensions
            if (videoElement.readyState >= 2) {
                drawVideoFrame();
            }
        }
        
        function preloadAudio() {
            // Get unique audio files from timeline
            const uniqueAudio = new Set();
            audioTimeline.forEach(item => uniqueAudio.add(item.audio));
            
            // Add required audio for questions
            uniqueAudio.add("incorrect_red");
            uniqueAudio.add("incorrect_blue");
            uniqueAudio.add("kiki");
            uniqueAudio.add("bubba");
            
            logDebug(`Preloading ${uniqueAudio.size} audio files...`);
            
            // Create audio elements
            uniqueAudio.forEach(audioFile => {
                const audio = new Audio(`${audioPath}/${audioFile}.mp3`);
                audio.preload = 'auto';
                
                // Track loading success
                audio.addEventListener('canplaythrough', () => {
                    logDebug(`Audio loaded: ${audioFile}.mp3 (${audio.duration.toFixed(2)}s)`);
                });
                
                // Track errors
                audio.addEventListener('error', () => {
                    logDebug(`Error loading audio: ${audioFile}.mp3`);
                });
                
                audioElements[audioFile] = audio;
            });
        }
        
        function startPlayback() {
            // Hide start button
            startButton.style.display = 'none';
            
            // Show controls
            controlBar.style.display = 'flex';
            
            // Reset state
            currentTime = 0;
            lastFrameTime = 0;
            isPlaying = true;
            isFrozen = false;
            activeFreezePoint = null;
            freezeFrameCaptured = false;
            
            // Reset all audio elements
            Object.values(audioElements).forEach(audio => {
                audio.pause();
                audio.currentTime = 0;
            });
            
            // Reset timeline events played status
            audioTimeline.forEach(event => {
                event.played = false;
            });
            
            // Hide freeze canvas
            freezeCanvas.style.display = 'none';
            
            // Start animation loop
            requestAnimationFrame(updatePlayer);
            
            logDebug('Playback started');
        }
        
        function togglePlayPause() {
            isPlaying = !isPlaying;
            
            // Update button text
            playPauseButton.textContent = isPlaying ? '❚❚' : '▶';
            
            // If resuming, start animation loop again
            if (isPlaying && !animationFrameId) {
                lastFrameTime = performance.now();
                requestAnimationFrame(updatePlayer);
            }
            
            logDebug(`Playback ${isPlaying ? 'resumed' : 'paused'}`);
        }
        
        function seekVideo(e) {
            // Calculate position relative to progress bar
            const rect = progressBar.getBoundingClientRect();
            const position = (e.clientX - rect.left) / rect.width;
            
            // Set new time
            const newTime = position * videoDuration;
            currentTime = Math.max(0, Math.min(newTime, videoDuration));
            
            // Reset freeze state
            isFrozen = false;
            activeFreezePoint = null;
            freezeFrameCaptured = false;
            freezeCanvas.style.display = 'none';
            
            // Seek video element to sync audio
            videoElement.currentTime = currentTime;
            
            // Draw the frame at the new position
            drawVideoFrame();
            
            // Update display
            updateTimeDisplay();
            
            // Reset audio played flags for any audio after the current time
            audioTimeline.forEach(event => {
                if (event.time >= currentTime) {
                    event.played = false;
                }
            });
            
            logDebug(`Seeked to ${currentTime.toFixed(2)}s`);
        }
        
        function updatePlayer(timestamp) {
            // Calculate time delta
            if (!lastFrameTime) {
                lastFrameTime = timestamp;
            }
            const deltaTime = (timestamp - lastFrameTime) / 1000; // in seconds
            lastFrameTime = timestamp;
            
            // Only update time if playing
            if (isPlaying) {
                // Always update time - even if frozen, audio still plays
                currentTime += deltaTime;
                
                // Check for end of video
                if (currentTime >= videoDuration) {
                    currentTime = videoDuration;
                    isPlaying = false;
                    playPauseButton.textContent = '▶';
                    onVideoEnded();
                }
            }
            
            // Check for freeze points
            checkFreezePoints();
            
            // Check for audio events
            checkAudioEvents();
            
            // Draw current frame - only if not frozen
            if (!isFrozen) {
                drawVideoFrame();
            }
            
            // Update time display and progress bar
            updateTimeDisplay();
            
            // Continue animation loop if playing
            if (isPlaying || isFrozen) {
                animationFrameId = requestAnimationFrame(updatePlayer);
            } else {
                animationFrameId = null;
            }
        }
        
        function checkFreezePoints() {
            // Check if we're currently in a freeze point
            if (!isFrozen) {
                // Find if we've hit a new freeze point
                for (let i = 0; i < freezeTimeline.length; i++) {
                    const freezePoint = freezeTimeline[i];
                    if (currentTime >= freezePoint.start && currentTime < freezePoint.end) {
                        // Enter frozen state
                        activeFreezePoint = freezePoint;
                        isFrozen = true;
                        freezeFrameCaptured = false; // Reset freeze frame capture flag
                        logDebug(`[FREEZE] Video frozen at ${currentTime.toFixed(2)}s until ${freezePoint.end}s`);
                        
                        // Immediately capture the freeze frame
                        captureAndDisplayFreezeFrame();
                        break;
                    }
                }
            } else {
                // Check if we should exit freeze
                if (currentTime >= activeFreezePoint.end) {
                    // Exit frozen state
                    exitFrozenState();
                    logDebug(`[UNFREEZE] Video unfrozen at ${currentTime.toFixed(2)}s`);
                }
            }
        }
        
        function captureAndDisplayFreezeFrame() {
            // Make sure the video is at the correct frame
            videoElement.currentTime = activeFreezePoint.start;
            
            // Function to capture frame once video is ready
            const captureFrame = () => {
                // Draw video frame to freeze canvas
                freezeCtx.drawImage(videoElement, 0, 0, freezeCanvas.width, freezeCanvas.height);
                
                // Hide main canvas, show freeze canvas
                canvasElement.style.display = 'none';
                freezeCanvas.style.display = 'block';
                
                freezeFrameCaptured = true;
                
                // Remove the event listener to avoid multiple captures
                videoElement.removeEventListener('seeked', captureFrame);
                
                logDebug(`[FREEZE] Frame captured at ${activeFreezePoint.start}s`);
            };
            
            // Add event listener for when seeking is complete
            videoElement.addEventListener('seeked', captureFrame, { once: true });
        }
        
        function exitFrozenState() {
            isFrozen = false;
            activeFreezePoint = null;
            
            // Hide freeze canvas, show main canvas
            freezeCanvas.style.display = 'none';
            canvasElement.style.display = 'block';
            
            // Make sure video is at the correct time
            videoElement.currentTime = currentTime;
            
            // Draw current frame
            drawVideoFrame();
        }
        
        function checkAudioEvents() {
            // Check for audio events to trigger
            audioTimeline.forEach(event => {
                // If we've reached the time for this audio and it hasn't been played
                if (currentTime >= event.time && !event.played) {
                    playAudio(event.audio);
                    event.played = true;
                    logDebug(`[AUDIO] Playing "${event.audio}" at ${currentTime.toFixed(2)}s`);
                }
            });
        }
        
        function drawVideoFrame() {
            // Make sure video element is at current time
            if (Math.abs(videoElement.currentTime - currentTime) > 0.1) {
                videoElement.currentTime = currentTime;
            }
            
            // Draw the current frame to canvas
            if (videoElement.readyState >= 2) {
                ctx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);
            }
        }
        
        function updateTimeDisplay() {
            // Update time display
            timeDisplay.textContent = `${formatTime(currentTime)} / ${formatTime(videoDuration)}`;
            
            // Update progress bar
            const progress = (currentTime / videoDuration) * 100;
            progressFill.style.width = `${progress}%`;
        }
        
        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${minutes}:${secs.toString().padStart(2, '0')}`;
        }
        
        function playAudio(audioName) {
            // Get audio element
            const audio = audioElements[audioName];
            
            if (audio) {
                // Reset to beginning
                audio.currentTime = 0;
                
                // Play the audio
                audio.play()
                    .then(() => {
                        logDebug(`Audio "${audioName}" started playing`);
                    })
                    .catch(error => {
                        logDebug(`Error playing audio ${audioName}: ${error.message}`);
                    });
            } else {
                logDebug(`Audio not found: ${audioName}`);
            }
        }
        
        function onVideoEnded() {
            logDebug('Video playback ended');
            
            // Tell parent frame to move to next step if applicable
            try {
                window.parent.postMessage({
                    type: 'nextFrame'
                }, '*');
                logDebug('Sent nextFrame message to parent');
            } catch (err) {
                logDebug(`Error sending message to parent: ${err.message}`);
            }
        }
        
        function onMessageReceived(event) {
            if (event.data && event.data.type) {
                switch (event.data.type) {
                    case 'play':
                        if (!isPlaying) togglePlayPause();
                        break;
                        
                    case 'pause':
                        if (isPlaying) togglePlayPause();
                        break;
                        
                    case 'setCondition':
                        // Reload page with new condition
                        if (event.data.version && event.data.cb) {
                            const url = new URL(window.location);
                            url.searchParams.set('task', event.data.version.split('_')[0]);
                            url.searchParams.set('version', event.data.version.split('_')[1]);
                            url.searchParams.set('cb', event.data.cb);
                            window.location.href = url.toString();
                        }
                        break;
                }
            }
        }
        
        // Start initialization when document is ready
        document.addEventListener('DOMContentLoaded', initExperiment);
    </script>
</body>
</html>
